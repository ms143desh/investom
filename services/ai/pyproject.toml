[project]
name = "investom-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "anthropic==0.34.2",
  "openai==1.47.0",
  "pandas==2.2.3",
  "pandas-ta==0.3.14b0",
  "numpy==1.26.4",
  "yfinance==0.2.44",
  "python-dotenv==1.0.1",
  "httpx==0.27.2",
  "supabase==2.7.4",
  "modal==0.64.10",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "pytest-cov==5.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"
